steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'us-central1-docker.pkg.dev/juriai-app/cloud-run-source-deploy/juriai-staging:latest', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'us-central1-docker.pkg.dev/juriai-app/cloud-run-source-deploy/juriai-staging:latest']
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'juriai-staging'
      - '--image'
      - 'us-central1-docker.pkg.dev/juriai-app/cloud-run-source-deploy/juriai-staging:latest'
      - '--region'
      - 'us-central1'
      - '--project'
      - 'juriai-app'
images:
  - 'us-central1-docker.pkg.dev/juriai-app/cloud-run-source-deploy/juriai-staging:latest'
options:
  logging: CLOUD_LOGGING_ONLY
